<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de treino</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a8391f">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
  :root{
    --ink:#1c1b19;
    --paper:#f6f4ee;
    --card:#ffffff;
    --line:#dedad0;
    --line-strong:#c7c1b2;
    --a-accent:#a8391f;
    --a-accent-soft:#f1e2dc;
    --b-accent:#2f5540;
    --b-accent-soft:#e1ece4;
    --muted:#7a756a;
    --font-head: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 80px;}
  header{margin-bottom:18px;}
  .eyebrow{
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:0.02em;
    margin:0 0 2px;
  }
  h1{
    font-family:var(--font-head);
    font-weight:600;
    font-size:26px;
    margin:0 0 4px;
    line-height:1.15;
  }
  .sub{font-size:13.5px;color:var(--muted);margin:0;}

  .tabs{
    display:flex;
    gap:8px;
    margin:18px 0 16px;
  }
  .tab{
    flex:1;
    padding:10px 8px;
    text-align:center;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--card);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    color:var(--muted);
    transition:background 0.15s, color 0.15s, border-color 0.15s;
  }
  .tab.active-a{background:var(--a-accent-soft);border-color:var(--a-accent);color:var(--a-accent);}
  .tab.active-b{background:var(--b-accent-soft);border-color:var(--b-accent);color:var(--b-accent);}

  .session-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
    font-size:13px;
    color:var(--muted);
  }
  .session-bar input[type=date]{
    font-family:inherit;
    font-size:13px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 8px;
    background:var(--card);
    color:var(--ink);
  }
  .streak{font-size:13px;font-weight:600;color:var(--ink);}

  .exercise{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 14px 12px;
    margin-bottom:10px;
  }
  .exercise.done{border-color:var(--line-strong);}
  .ex-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
    cursor:pointer;
  }
  .ex-title-block{flex:1;}
  .ex-num{font-size:11.5px;color:var(--muted);margin:0 0 1px;}
  .ex-name{font-size:15.5px;font-weight:600;margin:0 0 3px;line-height:1.3;}
  .ex-target{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0;}
  .ex-note{
    font-size:12px;
    color:var(--a-accent);
    margin-top:4px;
    font-weight:600;
  }
  .tab-b .ex-note{color:var(--b-accent);}

  .check{
    width:26px;height:26px;
    border-radius:50%;
    border:1.5px solid var(--line-strong);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
    color:transparent;
    background:var(--paper);
  }
  .exercise.done .check{
    background:var(--a-accent);
    border-color:var(--a-accent);
    color:#fff;
  }
  .tab-b .exercise.done .check{
    background:var(--b-accent);
    border-color:var(--b-accent);
  }

  .sets{
    margin-top:12px;
    padding-top:10px;
    border-top:1px solid var(--line);
    display:none;
  }
  .exercise.expanded .sets{display:block;}
  .set-row{
    display:grid;
    grid-template-columns:28px 1fr 1fr 24px;
    gap:8px;
    align-items:center;
    margin-bottom:6px;
  }
  .set-row .set-idx{font-size:12px;color:var(--muted);text-align:center;}
  .set-row input[type=number]{
    width:100%;
    font-family:inherit;
    font-size:14px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:6px 8px;
    background:var(--paper);
    color:var(--ink);
  }
  .set-row input[type=number]:focus{outline:none;border-color:var(--a-accent);}
  .tab-b .set-row input[type=number]:focus{border-color:var(--b-accent);}
  .set-row .rm{
    background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;
    padding:0;line-height:1;
  }
  .set-labels{
    display:grid;
    grid-template-columns:28px 1fr 1fr 24px;
    gap:8px;
    font-size:11px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .add-set{
    font-size:12.5px;
    color:var(--a-accent);
    background:none;
    border:none;
    font-weight:600;
    cursor:pointer;
    padding:4px 0 0;
  }
  .tab-b .add-set{color:var(--b-accent);}

  .ex-comment{
    width:100%;
    margin-top:10px;
    font-family:inherit;
    font-size:13px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:7px 9px;
    background:var(--paper);
    color:var(--ink);
    resize:vertical;
    min-height:34px;
  }

  .summary{
    display:flex;
    gap:10px;
    margin:18px 0;
  }
  .stat{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    text-align:center;
  }
  .stat b{display:block;font-size:19px;font-weight:600;}
  .stat span{font-size:11px;color:var(--muted);}

  .history{
    margin-top:26px;
  }
  .history h2{
    font-family:var(--font-head);
    font-size:17px;
    font-weight:600;
    margin:0 0 10px;
  }
  .hist-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .hist-item:last-child{border-bottom:none;}
  .hist-tag{
    font-size:11px;
    font-weight:700;
    padding:2px 7px;
    border-radius:6px;
    margin-right:8px;
  }
  .hist-tag.a{background:var(--a-accent-soft);color:var(--a-accent);}
  .hist-tag.b{background:var(--b-accent-soft);color:var(--b-accent);}
  .hist-date{color:var(--muted);}
  .hist-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;}
  .empty{color:var(--muted);font-size:13px;padding:12px 0;}

  .save-bar{
    position:sticky;
    bottom:0;
    background:linear-gradient(to top, var(--paper) 70%, transparent);
    padding:16px 0 4px;
    margin-top:6px;
  }
  .save-btn{
    width:100%;
    padding:13px;
    border-radius:10px;
    border:none;
    background:var(--a-accent);
    color:#fff;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
  }
  .tab-b .save-btn{background:var(--b-accent);}
  .save-btn:active{opacity:0.85;}
  .save-msg{
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
    margin-top:8px;
    min-height:16px;
  }
</style>
</head>
<body>
<div class="wrap" id="app">

  <header>
    <p class="eyebrow">Musculação · fim de semana</p>
    <h1>Registro de treino</h1>
    <p class="sub" id="subhead">Treino A — Anterior</p>
  </header>

  <div class="tabs">
    <div class="tab" id="tabA" onclick="switchTab('A')">Treino A</div>
    <div class="tab" id="tabB" onclick="switchTab('B')">Treino B</div>
  </div>

  <div class="session-bar">
    <span>Data da sessão</span>
    <input type="date" id="sessionDate">
  </div>

  <div class="summary">
    <div class="stat"><b id="statDone">0/8</b><span>exercícios feitos</span></div>
    <div class="stat"><b id="statSessions">0</b><span>sessões salvas</span></div>
    <div class="stat"><b id="statLast">—</b><span>último treino</span></div>
  </div>

  <div id="exerciseList"></div>

  <div class="save-bar">
    <button class="save-btn" id="saveBtn" onclick="saveSession()">Salvar sessão de hoje</button>
    <p class="save-msg" id="saveMsg"></p>
  </div>

  <div class="history">
    <h2>Histórico</h2>
    <div id="historyList"></div>
  </div>

</div>

<script>
const PLANS = {
  A: {
    label: "Treino A — Anterior",
    tag: "Peito · Ombros · Tríceps · Quadríceps",
    exercises: [
      { name: "Supino reto", target: "2x aquecimento progressivo (20/15) + 3 séries de 8–10", sets: 3 },
      { name: "Supino inclinado com halteres", target: "1x aquecimento (20) + 3 séries de 10–12", sets: 3 },
      { name: "Desenvolvimento com halteres", target: "3 séries de 8–10", sets: 3 },
      { name: "Elevação lateral", target: "3 séries de 12–15", sets: 3 },
      { name: "Tríceps pulley", target: "3 séries de 10–12", sets: 3 },
      { name: "Leg press 45°", target: "2x aquecimento progressivo (15/20) + 3 séries de 8–10", sets: 3 },
      { name: "Afundo com halteres", target: "3 séries de 10 (cada perna)", sets: 3 },
      { name: "Cadeira extensora", target: "3 séries de 12–15", sets: 3, note: "Última série: drop-set até próximo da falha" }
    ]
  },
  B: {
    label: "Treino B — Posterior",
    tag: "Costas · Bíceps · Post. ombro · Post. coxa · Glúteos",
    exercises: [
      { name: "Pulley frente", target: "2x aquecimento progressivo (20/15) + 3 séries de 8–10", sets: 3 },
      { name: "Remada baixa", target: "1x aquecimento (20) + 3 séries de 8–10", sets: 3 },
      { name: "Pulldown", target: "3 séries de 10–12", sets: 3 },
      { name: "Crucifixo inverso", target: "3 séries de 12–15", sets: 3 },
      { name: "Rosca direta com barra W", target: "3 séries de 8–10", sets: 3 },
      { name: "Stiff", target: "2x aquecimento progressivo (20/15) + 3 séries de 8–10", sets: 3 },
      { name: "Mesa flexora", target: "3 séries de 10–12", sets: 3, note: "Última série: rest-pause — 10–12 reps, 15–20s, +4–6 reps" },
      { name: "Elevação pélvica", target: "3 séries de 10–12", sets: 3 },
      { name: "Panturrilha na máquina", target: "4 séries de 15–20", sets: 4 }
    ]
  }
};

let currentTab = "A";
let state = {}; // per-exercise runtime state: {done, expanded, sets:[{reps,kg}], comment}
let history = [];

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}

function resetState(planKey){
  const plan = PLANS[planKey];
  state = plan.exercises.map(ex => ({
    done:false,
    expanded:false,
    sets: Array.from({length: ex.sets}, () => ({reps:"", kg:"", repsTouched:false, kgTouched:false})),
    comment:""
  }));
}

function switchTab(key){
  currentTab = key;
  document.getElementById('tabA').className = 'tab' + (key==='A' ? ' active-a' : '');
  document.getElementById('tabB').className = 'tab' + (key==='B' ? ' active-b' : '');
  document.getElementById('app').classList.remove('tab-a','tab-b');
  document.getElementById('app').classList.add(key==='A' ? 'tab-a' : 'tab-b');
  document.getElementById('subhead').textContent = PLANS[key].label + " · " + PLANS[key].tag;
  resetState(key);
  renderExercises();
  updateStats();
}

function toggleExpand(i){
  state[i].expanded = !state[i].expanded;
  renderExercises();
}

function toggleDone(i, evt){
  evt.stopPropagation();
  state[i].done = !state[i].done;
  renderExercises();
  updateStats();
}

function updateSet(i, j, field, value){
  const sets = state[i].sets;
  sets[j][field] = value;
  const touchedFlag = field === 'reps' ? 'repsTouched' : 'kgTouched';
  sets[j][touchedFlag] = true;

  if(j === 0){
    for(let k = 1; k < sets.length; k++){
      if(!sets[k][touchedFlag]){
        sets[k][field] = value;
        const input = document.querySelector(`input[data-ex="${i}"][data-set="${k}"][data-field="${field}"]`);
        if(input) input.value = value;
      }
    }
  }
}

function addSet(i, evt){
  evt.stopPropagation();
  const first = state[i].sets[0];
  state[i].sets.push({
    reps: first ? first.reps : "",
    kg: first ? first.kg : "",
    repsTouched:false,
    kgTouched:false
  });
  renderExercises();
}

function removeSet(i, j, evt){
  evt.stopPropagation();
  state[i].sets.splice(j,1);
  renderExercises();
}

function updateComment(i, value){
  state[i].comment = value;
}

function renderExercises(){
  const plan = PLANS[currentTab];
  const list = document.getElementById('exerciseList');
  list.innerHTML = "";
  plan.exercises.forEach((ex, i) => {
    const st = state[i];
    const card = document.createElement('div');
    card.className = 'exercise' + (st.done ? ' done' : '') + (st.expanded ? ' expanded' : '');

    let setsHtml = '<div class="set-labels"><span></span><span>Reps</span><span>Carga (kg)</span><span></span></div>';
    st.sets.forEach((s, j) => {
      setsHtml += `
        <div class="set-row">
          <span class="set-idx">${j+1}</span>
          <input type="number" inputmode="numeric" placeholder="reps" value="${s.reps}" data-ex="${i}" data-set="${j}" data-field="reps" onclick="event.stopPropagation()" oninput="updateSet(${i},${j},'reps',this.value)">
          <input type="number" inputmode="decimal" placeholder="kg" value="${s.kg}" data-ex="${i}" data-set="${j}" data-field="kg" onclick="event.stopPropagation()" oninput="updateSet(${i},${j},'kg',this.value)">
          <button class="rm" aria-label="Remover série" onclick="removeSet(${i},${j},event)"><i class="ti ti-x"></i>&times;</button>
        </div>`;
    });
    setsHtml += `<button class="add-set" onclick="addSet(${i},event)">+ adicionar série</button>`;
    setsHtml += `<textarea class="ex-comment" placeholder="Observação (opcional)" onclick="event.stopPropagation()" oninput="updateComment(${i},this.value)">${st.comment}</textarea>`;

    card.innerHTML = `
      <div class="ex-head" onclick="toggleExpand(${i})">
        <div class="ex-title-block">
          <p class="ex-num">${i+1}</p>
          <p class="ex-name">${ex.name}</p>
          <p class="ex-target">${ex.target}</p>
          ${ex.note ? `<p class="ex-note">${ex.note}</p>` : ""}
        </div>
        <div class="check" onclick="toggleDone(${i}, event)">${st.done ? '&#10003;' : ''}</div>
      </div>
      <div class="sets">${setsHtml}</div>
    `;
    list.appendChild(card);
  });
}

function updateStats(){
  const doneCount = state.filter(s => s.done).length;
  document.getElementById('statDone').textContent = doneCount + "/" + state.length;
  document.getElementById('statSessions').textContent = history.length;
  if(history.length > 0){
    const last = history[0];
    document.getElementById('statLast').textContent = formatDateShort(last.date);
  } else {
    document.getElementById('statLast').textContent = "—";
  }
}

function formatDateShort(iso){
  const [y,m,d] = iso.split('-');
  return d + '/' + m;
}

async function loadHistory(){
  try{
    const raw = localStorage.getItem('training-history');
    if(raw){
      history = JSON.parse(raw);
    }
  }catch(e){
    history = [];
  }
  renderHistory();
  updateStats();
}

async function saveHistory(){
  try{
    localStorage.setItem('training-history', JSON.stringify(history));
  }catch(e){
    console.error('Falha ao salvar', e);
  }
}

function renderHistory(){
  const el = document.getElementById('historyList');
  if(history.length === 0){
    el.innerHTML = '<p class="empty">Nenhuma sessão registrada ainda.</p>';
    return;
  }
  el.innerHTML = "";
  history.forEach((h, idx) => {
    const row = document.createElement('div');
    row.className = 'hist-item';
    row.innerHTML = `
      <span><span class="hist-tag ${h.workout.toLowerCase()}">${h.workout}</span><span class="hist-date">${formatDateFull(h.date)} · ${h.doneCount}/${h.total} feitos</span></span>
      <button class="hist-del" onclick="deleteHistory(${idx})">remover</button>
    `;
    el.appendChild(row);
  });
}

function formatDateFull(iso){
  const [y,m,d] = iso.split('-');
  return d + '/' + m + '/' + y;
}

async function deleteHistory(idx){
  history.splice(idx,1);
  await saveHistory();
  renderHistory();
  updateStats();
}

async function saveSession(){
  const date = document.getElementById('sessionDate').value || todayStr();
  const doneCount = state.filter(s => s.done).length;
  const entry = {
    date,
    workout: currentTab,
    doneCount,
    total: state.length,
    exercises: PLANS[currentTab].exercises.map((ex, i) => ({
      name: ex.name,
      done: state[i].done,
      sets: state[i].sets.filter(s => s.reps !== "" || s.kg !== ""),
      comment: state[i].comment
    }))
  };
  history.unshift(entry);
  await saveHistory();
  renderHistory();
  updateStats();
  const msg = document.getElementById('saveMsg');
  msg.textContent = "Sessão salva — " + formatDateFull(date);
  setTimeout(() => { msg.textContent = ""; }, 3000);
}

document.getElementById('sessionDate').value = todayStr();
switchTab('A');
loadHistory();

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
