<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de treino</title>
<style>
  :root{
    --ink:#1c1b19;
    --paper:#f6f4ee;
    --card:#ffffff;
    --line:#dedad0;
    --line-strong:#c7c1b2;
    --a-accent:#a8391f;
    --a-accent-soft:#f1e2dc;
    --b-accent:#2f5540;
    --b-accent-soft:#e1ece4;
    --muted:#7a756a;
    --font-head: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 80px;}
  header{margin-bottom:18px;}
  .eyebrow{
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:0.02em;
    margin:0 0 2px;
  }
